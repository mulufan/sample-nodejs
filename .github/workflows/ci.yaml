name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default; jobs that need more request it explicitly (release-tag: to save that tag after all test passed)
permissions:
  contents: read

# Cancel superseded PR runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  IMAGE_NAME: sample-nodejs
  CHART_PATH: helm/sample-nodejs

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags are needed to find the latest release
          fetch-depth: 0

      - name: Determine next version
        id: next
        run: |
          version=$(python3 scripts/next_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Install and validate app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check app.js

      - name: Smoke test app
        run: |
          PORT=8080 node app.js > app.log 2>&1 &
          python3 scripts/smoke_test.py http://localhost:8080

      - name: Show app log
        if: failure()
        run: cat app.log

  helm-lint:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint "$CHART_PATH"
          helm lint "$CHART_PATH" -f "$CHART_PATH/values-local.yaml"

      - name: Render templates
        run: |
          helm template ci "$CHART_PATH" > /dev/null
          helm template ci "$CHART_PATH" -f "$CHART_PATH/values-local.yaml" > /dev/null

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Fail instead of hanging if the scan or image pull stalls
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@v4

      # Report-only registry rulesets plus the custom CRITICAL rules in .semgrep/.
      # Helm templates are not valid YAML until rendered (helm-lint covers them).
      - name: Run Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan                      \
              --config p/javascript           \
              --config p/python               \
              --config p/owasp-top-ten        \
              --config .semgrep/critical.yml  \
              --exclude "$CHART_PATH/templates" \
              --metrics=off                   \
              --json-output=semgrep.json      \
              --sarif-output=semgrep.sarif

      - name: Upload SARIF (Static Analysis Results)
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Fails closed: a missing/invalid report or any scan error fails the job.
      # Only CRITICAL findings (custom rules) block; everything else is reported.
      - name: Fail on CRITICAL findings
        run: python3 scripts/sast_gate.py semgrep.json

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [version, validate, sast]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TRIVY_IMAGE: aquasec/trivy:0.65.0
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only; pushing to the registry is added in a later stage
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the image loaded above via the Docker socket (no rebuild).
      # Any HIGH/CRITICAL finding fails the job, which blocks release-tag.
      - name: Scan image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image                        \
              --scanners vuln            \
              --severity HIGH,CRITICAL   \
              --exit-code 1              \
              --no-progress              \
              "$IMAGE_NAME:$VERSION"

      - name: Smoke test container
        run: |
          docker run -d --name app -p 8080:8080 "$IMAGE_NAME:$VERSION"
          python3 scripts/smoke_test.py http://localhost:8080

      - name: Show container log
        if: failure()
        run: docker logs app

  release-tag:
    name: Tag release
    runs-on: ubuntu-latest
    # Releases are cut only from main, after every check has passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, validate, helm-lint, docker-build, sast]
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Released \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
