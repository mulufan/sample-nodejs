# Values for the Argo CD (GitOps) deployment of the private GHCR image
image:
  repository: ghcr.io/mulufan/sample-nodejs
  # Release version deployed by Argo CD
  tag: "1.3.0"
  pullPolicy: IfNotPresent

# Created manually in the target namespace; never stored in Git
imagePullSecrets:
  - name: ghcr-pull-secret

# Expose via the Traefik ingress controller at http://sample-nodejs.local/my-app
ingress:
  enabled: true
  className: traefik
  host: sample-nodejs.local
  path: /my-app
  pathType: Prefix
